esphome:
  name: smart-audio-speaker
  friendly_name: "Smart Audio Speaker"

esp32:
  board: esp32-s3-devkitc1-n16r8
  variant: esp32s3
  framework:
    type: esp-idf

# PSRAM ayarı (ESP32-S3 Octal PSRAM için 80MHz önerilir)
psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret esphome_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  ap:
    ssid: "Smart-Audio-Fallback-Hotspot"
    password: !secret fallback_password

captive_portal:

# ========================================================
# I2S SES ÇIKIŞ HATLARI (I2S AUDIO PINS)
# ========================================================
i2s_audio:
  - id: i2s_hub
    i2s_lrclk_pin: GPIO13
    i2s_bclk_pin: GPIO12

# ========================================================
# MODERN ESPHOME SES MİMARİSİ (SPEAKER + MIXER + RESAMPLER)
# ========================================================
speaker:
  # 1. Fiziksel Hoparlör Katmanı (PCM5102A DAC)
  - platform: i2s_audio
    id: main_speaker
    i2s_audio_id: i2s_hub
    dac_type: external
    i2s_dout_pin: GPIO14
    buffer_duration: 3500ms # Wi-Fi jitter ve takılmaları önlemek için 3.5s tampon bellek

  # 2. Donanımsal/Yazılımsal Mikser (Mixer)
  # Müzik çalarken gelen bildirim ve anons seslerini miksleyip fiziksel hoparlöre iletir
  - platform: mixer
    id: audio_mixer
    output_speaker: main_speaker
    source_speakers:
      - id: media_mix_input
      - id: announcement_mix_input

  # 3. Medya Hattı Örnekleyici (Media Stream Resampler - 44.1 kHz Standart)
  - platform: resampler
    id: media_resampler
    output_speaker: media_mix_input
    sample_rate: 44100

  # 4. Anons Hattı Örnekleyici (Announcement/TTS Resampler - 44.1 kHz Standart)
  - platform: resampler
    id: announcement_resampler
    output_speaker: announcement_mix_input
    sample_rate: 44100

# ========================================================
# HOME ASSISTANT MEDYA OYNATICI (MEDIA PLAYER ENTITY)
# ========================================================
media_player:
  - platform: speaker
    name: "Akilli Muzik Seti Audio"
    media_pipeline:
      speaker: media_resampler
    announcement_pipeline:
      speaker: announcement_resampler
